services:
  - type: web
    name: fastapi-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port 8000
    envVars:
      - key: MONGO_URL
        scope: run
      - key: DB_NAME
        scope: run
      - key: RAZORPAY_KEY_ID
        scope: run
      - key: RAZORPAY_KEY_SECRET
        scope: run
      - key: CORS_ORIGINS
        value: "*"
